<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recover Password - CineView</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="container" id="pageTitle">
    <h1 class="page-title">Recover Password</h1>
    <p id="recoverMsg"></p>
    <form id="recoverForm">
        <input type="text" id="username" placeholder="Username" required />
        <input type="text" id="favorite_color" placeholder="Favorite color" required />
        <input type="text" id="birth_year" placeholder="Birth year" required />
        <input type="text" id="first_school" placeholder="First school" required />
        <button type="submit">Verify</button>
      </form>
      
      <form id="newPasswordForm" class="hidden">
        <input type="password" id="new_password" placeholder="New password" required />
        <button type="submit">Reset Password</button>
      </form>
    </div>    
    
      <div id="confirmationMessage" class="confirmation hidden">
        <h2>Password Reset!</h2>
        <p>Redirecting to login...</p>
      </div>  
  <script src="js/utils.js"></script>
  <script src="js/recover.js"></script>
</body>
</html>
