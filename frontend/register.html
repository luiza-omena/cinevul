<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register - CineViewExperience</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="container">
    <h1>Register</h1>
    <p id="registerMsg"></p>
    <form id="registerForm">
      <input type="text" id="full_name" placeholder="Full name" required />
      <input type="date" id="birth_date" required />
      <input type="text" id="username" placeholder="Username" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="text" id="phone" placeholder="Phone" />
      <input type="text" id="favorite_color" placeholder="Favorite color" required />
      <input type="text" id="birth_year" placeholder="Birth year" required />
      <input type="text" id="first_school" placeholder="First school" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Register</button>
    </form>
    <p><a href="login.html" class="login-link">Already have an account? Sign in</a></p>
  </div>
  <script src="js/register.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", registerUser);
  </script>
</body>
</html>
