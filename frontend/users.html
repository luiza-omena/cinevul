<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Users - CineView Dashboard</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/users.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
  <div class="menu-wrapper auth-only">
    <button class="menu-btn" onclick="toggleMenu()">
      <img src="assets/icons/Burger.svg" alt="Menu" class="burger-icon">
    </button>
    <div class="dropdown hidden" id="userMenu">
      <a href="index.html">Home</a>
      <a href="movies.html">Movies</a>
      <a href="profile.html">Profile</a>
      <a href="orders.html">Orders</a>
      <a href="dashboard-movies.html">Manage Movies</a>
      <button onclick="logout()">Log out</button>
    </div>
  </div>

  <div class="container">
    <h1>Users</h1>

    <div class="filters users-filters auth-only">
      <div class="search-filters">
        <input type="text" id="searchInput" placeholder="Search by name, username, email, or phone...">
        <button id="applyFilter" class="filter-btn">➤</button>
      </div>
      <select id="typeFilter">
        <option value="">All</option>
        <option value="admin">Admin</option>
        <option value="naoadmin">Non-admin</option>
      </select>
    </div>
    

    <div id="activeFilters" class="active-filters auth-only"></div>
    <div id="usersList" class="auth-only"></div>

    <div class="pagination auth-only">
      <button id="prevPage">⟨</button>
      <div id="paginationNumbers" class="pagination-numbers"></div>
      <button id="nextPage">⟩</button>
      <select id="perPageSelect" class="per-page-select">
        <option value="5">5 per page</option>
        <option value="10" selected>10 per page</option>
        <option value="20">20 per page</option>
        <option value="50">50 per page</option>
      </select>
    </div>
  </div>

  <div id="deleteModal" class="modal hidden">
    <div class="modal-content">
      <span class="close" onclick="closeDeleteModal()">&times;</span>
      <h3>Confirm Deletion</h3>
      <p>Are you sure you want to delete this user?</p>
      <div class="modal-actions">
        <button id="confirmDelete">Delete</button>
        <button id="cancelDelete">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/users.js"></script>
  <script src="js/utils.js"></script>
</body>
</html>
